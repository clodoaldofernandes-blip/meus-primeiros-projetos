<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imóveis | Clodoaldo Fernandes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --azul: #1a56db;
  --azul-escuro: #1340a8;
  --azul-claro: #e8f0fe;
  --cinza: #f8faff;
  --cinza-borda: #e5e7eb;
  --texto: #555;
  --preto: #111;
  --branco: #fff;
  --sombra: 0 8px 32px rgba(26,86,219,.12);
  --radius: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--cinza); color: #222; }

header {
  background: linear-gradient(135deg, #0f172a 0%, #1a56db 100%);
  color: white;
  text-align: center;
  padding: 4rem 2rem 3rem;
  position: relative;
}

.header-nav {
  position: absolute;
  top: 1rem; left: 2rem; right: 2rem;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.btn-voltar-header {
  color: white; text-decoration: none;
  font-size: .85rem; font-weight: 600;
  opacity: .85; transition: opacity .2s;
}

.btn-voltar-header:hover { opacity: 1; }

header h1 { font-size: 2rem; font-weight: 800; margin-bottom: .5rem; }
header p { opacity: .85; font-size: .95rem; margin-bottom: 1.5rem; }

.stats { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }

.stat {
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 999px;
  padding: .35rem 1rem;
  font-size: .82rem; font-weight: 600;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 4rem;
}

.filtros {
  background: white;
  border-radius: var(--radius);
  padding: 1.25rem 1.5rem;
  box-shadow: var(--sombra);
  border: 1px solid var(--cinza-borda);
  margin-bottom: 2rem;
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  align-items: center;
}

.filtros-titulo {
  font-size: .78rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px;
  color: var(--azul); margin-right: .5rem;
}

.filtro-btn {
  padding: .4rem 1rem;
  border-radius: 999px;
  border: 1.5px solid var(--cinza-borda);
  background: white;
  font-size: .82rem; font-weight: 600;
  color: var(--texto);
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
}

.filtro-btn:hover { border-color: var(--azul); color: var(--azul); }
.filtro-btn.ativo { background: var(--azul); color: white; border-color: var(--azul); }

.busca-wrap { margin-left: auto; position: relative; }

.busca-wrap input {
  padding: .45rem 1rem .45rem 2.2rem;
  border: 1.5px solid var(--cinza-borda);
  border-radius: 999px;
  font-size: .85rem; font-family: inherit;
  outline: none; transition: border-color .2s; width: 200px;
}

.busca-wrap input:focus { border-color: var(--azul); }

.busca-wrap .icone {
  position: absolute; left: .75rem; top: 50%;
  transform: translateY(-50%);
  font-size: .85rem; color: #aaa;
}

.grid-imoveis {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.5rem;
}

.card-imovel {
  background: white;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,.07);
  border: 1px solid var(--cinza-borda);
  transition: transform .2s, box-shadow .2s;
}

.card-imovel:hover { transform: translateY(-5px); box-shadow: var(--sombra); }

.card-foto {
  position: relative; height: 220px;
  overflow: hidden; background: #e5e7eb;
}

.card-foto img {
  width: 100%; height: 100%;
  object-fit: cover; transition: transform .3s;
}

.card-imovel:hover .card-foto img { transform: scale(1.05); }

.card-foto .sem-foto {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 3rem; color: #ccc; background: #f3f4f6;
}

.badge-tipo-imovel {
  position: absolute; top: 12px; left: 12px;
  background: var(--azul); color: white;
  font-size: .7rem; font-weight: 700;
  padding: .25rem .7rem; border-radius: 999px;
  text-transform: uppercase; letter-spacing: .3px;
}

.badge-tipo-imovel.venda { background: #0f172a; }
.badge-tipo-imovel.locacao { background: #059669; }
.badge-tipo-imovel.temporada { background: #7c3aed; }

.badge-destaque {
  position: absolute; top: 12px; right: 12px;
  background: #f4b400; color: #0f172a;
  font-size: .68rem; font-weight: 800;
  padding: .2rem .6rem; border-radius: 999px;
}

.badge-mais-fotos {
  position: absolute; bottom: 12px; right: 12px;
  background: rgba(0,0,0,.6); color: white;
  font-size: .7rem; font-weight: 700;
  padding: .2rem .6rem; border-radius: 999px;
}

.card-body { padding: 1.25rem; }
.card-preco { font-size: 1.4rem; font-weight: 800; color: var(--azul); margin-bottom: .3rem; }
.card-titulo { font-size: .95rem; font-weight: 700; color: var(--preto); margin-bottom: .5rem; }

.card-local {
  font-size: .82rem; color: var(--texto);
  margin-bottom: .75rem;
  display: flex; align-items: center; gap: .3rem;
}

.card-specs {
  display: flex; gap: .75rem; flex-wrap: wrap;
  margin-bottom: 1rem;
  padding-bottom: .75rem;
  border-bottom: 1px solid var(--cinza-borda);
}

.spec { font-size: .78rem; color: var(--texto); display: flex; align-items: center; gap: .25rem; }

.card-desc {
  font-size: .83rem; color: var(--texto);
  line-height: 1.6; margin-bottom: 1rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-acoes { display: flex; gap: .6rem; }

.btn-whatsapp-imovel {
  flex: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  background: #25d366; color: white;
  text-decoration: none; padding: .7rem;
  border-radius: 9px; font-size: .85rem; font-weight: 700;
  transition: background .2s;
}

.btn-whatsapp-imovel:hover { background: #1da851; }

.btn-ver-mais {
  flex: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  background: var(--azul-claro); color: var(--azul);
  border: none; padding: .7rem; border-radius: 9px;
  font-size: .85rem; font-weight: 700;
  cursor: pointer; font-family: inherit;
  transition: background .2s;
}

.btn-ver-mais:hover { background: #c7d7fc; }

.vazio-wrap {
  text-align: center; padding: 4rem 2rem; color: #aaa;
}

.vazio-wrap .icone { font-size: 3rem; margin-bottom: 1rem; }
.vazio-wrap p { font-size: .95rem; }

/* MODAL */
.modal-overlay {
  display: none; position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.6);
  z-index: 1000; padding: 1rem;
  overflow-y: auto;
}

.modal-overlay.aberto { display: flex; align-items: flex-start; justify-content: center; padding-top: 2rem; }

.modal {
  background: white; border-radius: var(--radius);
  max-width: 700px; width: 100%; overflow: hidden;
  animation: fadeIn .2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-foto-wrap { position: relative; background: #eee; }
.modal-foto { width: 100%; height: 300px; object-fit: cover; display: block; }

.modal-sem-foto {
  width: 100%; height: 200px;
  display: flex; align-items: center; justify-content: center;
  font-size: 4rem; background: #f3f4f6; color: #ccc;
}

.modal-nav-foto {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(0,0,0,.5); color: white;
  border: none; width: 34px; height: 34px;
  border-radius: 50%; font-size: 1rem;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
}

.modal-nav-foto.prev { left: 10px; }
.modal-nav-foto.next { right: 10px; }

.modal-thumbs {
  display: flex; gap: .4rem;
  padding: .6rem .75rem;
  overflow-x: auto;
  background: #fafbff;
  border-bottom: 1px solid var(--cinza-borda);
}

.modal-thumb {
  width: 56px; height: 56px;
  border-radius: 6px;
  object-fit: cover;
  cursor: pointer;
  opacity: .6;
  border: 2px solid transparent;
  flex-shrink: 0;
}

.modal-thumb.ativa { opacity: 1; border-color: var(--azul); }

.modal-body { padding: 1.75rem; }
.modal-preco { font-size: 1.8rem; font-weight: 800; color: var(--azul); margin-bottom: .3rem; }
.modal-titulo { font-size: 1.1rem; font-weight: 700; color: var(--preto); margin-bottom: .5rem; }
.modal-local { font-size: .88rem; color: var(--texto); margin-bottom: 1rem; }

.modal-specs {
  display: flex; gap: 1rem; flex-wrap: wrap;
  padding: 1rem 0;
  border-top: 1px solid var(--cinza-borda);
  border-bottom: 1px solid var(--cinza-borda);
  margin-bottom: 1rem;
}

.modal-spec { font-size: .85rem; color: var(--texto); display: flex; align-items: center; gap: .3rem; }
.modal-desc { font-size: .9rem; color: var(--texto); line-height: 1.8; margin-bottom: 1.25rem; }
.modal-acoes { display: flex; gap: .75rem; flex-wrap: wrap; }

.btn-fechar {
  position: absolute; top: 1rem; right: 1rem;
  background: rgba(0,0,0,.5); color: white;
  border: none; width: 36px; height: 36px;
  border-radius: 50%; font-size: 1.1rem;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  z-index: 2;
}

.modal-topo { position: relative; }

.rodape {
  text-align: center; padding: 2rem;
  font-size: .82rem; color: #aaa;
  border-top: 1px solid var(--cinza-borda);
}

.rodape a { color: var(--azul); text-decoration: none; font-weight: 600; }

@media (max-width: 600px) {
  .grid-imoveis { grid-template-columns: 1fr; }
  .busca-wrap { margin-left: 0; width: 100%; }
  .busca-wrap input { width: 100%; }
}
</style>
</head>
<body>

<header>
  <div class="header-nav">
    <a href="index.html" class="btn-voltar-header">← Voltar ao site</a>
  </div>
  <h1>🏠 Imóveis</h1>
  <p>Oportunidades selecionadas por Clodoaldo Fernandes · CRECI 14.464-F · João Pessoa/PB</p>
  <div class="stats">
    <span class="stat" id="statTotal">0 imóveis</span>
    <span class="stat" id="statVenda">0 à venda</span>
    <span class="stat" id="statLocacao">0 para alugar</span>
  </div>
</header>

<div class="container">

  <div class="filtros">
    <span class="filtros-titulo">Filtrar:</span>
    <button class="filtro-btn ativo" onclick="filtrar('todos', this)">Todos</button>
    <button class="filtro-btn" onclick="filtrar('Venda', this)">🏡 Venda</button>
    <button class="filtro-btn" onclick="filtrar('Locação', this)">🔑 Locação</button>
    <button class="filtro-btn" onclick="filtrar('Temporada', this)">🌴 Temporada</button>
    <div class="busca-wrap">
      <span class="icone">🔍</span>
      <input type="text" id="busca" placeholder="Buscar bairro, tipo..." oninput="renderizar()">
    </div>
  </div>

  <div id="gridImoveis" class="grid-imoveis"></div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal" id="modal">
    <div class="modal-topo">
      <button class="btn-fechar" onclick="fecharModalBtn()">✕</button>
      <div class="modal-foto-wrap" id="modalFotoWrap"></div>
    </div>
    <div id="modalThumbs" class="modal-thumbs" style="display:none;"></div>
    <div class="modal-body">
      <div class="modal-preco" id="modalPreco"></div>
      <div class="modal-titulo" id="modalTitulo"></div>
      <div class="modal-local" id="modalLocal"></div>
      <div class="modal-specs" id="modalSpecs"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-acoes" id="modalAcoes"></div>
    </div>
  </div>
</div>

<div class="rodape">
  <a href="index.html">← Voltar ao site principal</a> &nbsp;·&nbsp;
  Clodoaldo Fernandes · CRECI 14.464-F · clodoaldofernandes.com.br
</div>

<script>
  const CHAVE_IMOVEIS = 'imoveisCF';
  let filtroAtivo = 'todos';
  let imoveis = JSON.parse(localStorage.getItem(CHAVE_IMOVEIS)) || [];
  let fotosModalAtual = [];
  let indiceFotoAtual = 0;

  function filtrar(tipo, btn) {
    filtroAtivo = tipo;
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
    btn.classList.add('ativo');
    renderizar();
  }

  function formatarTipo(tipo) {
    const map = { 'Venda': 'venda', 'Locação': 'locacao', 'Temporada': 'temporada' };
    return map[tipo] || '';
  }

  function fotosDoImovel(imovel) {
    return (imovel.fotos && imovel.fotos.length) ? imovel.fotos : (imovel.foto ? [imovel.foto] : []);
  }

  function renderizarFotoModal() {
    const wrap = document.getElementById('modalFotoWrap');
    if (fotosModalAtual.length === 0) {
      wrap.innerHTML = `<div class="modal-sem-foto">🏠</div>`;
      return;
    }
    wrap.innerHTML = `
      <img src="${fotosModalAtual[indiceFotoAtual]}" class="modal-foto">
      ${fotosModalAtual.length > 1 ? `
        <button class="modal-nav-foto prev" onclick="navegarFotoModal(-1)">‹</button>
        <button class="modal-nav-foto next" onclick="navegarFotoModal(1)">›</button>
      ` : ''}
    `;

    const thumbsWrap = document.getElementById('modalThumbs');
    if (fotosModalAtual.length > 1) {
      thumbsWrap.style.display = 'flex';
      thumbsWrap.innerHTML = fotosModalAtual.map((f, idx) => `
        <img src="${f}" class="modal-thumb ${idx === indiceFotoAtual ? 'ativa' : ''}" onclick="irParaFotoModal(${idx})">
      `).join('');
    } else {
      thumbsWrap.style.display = 'none';
      thumbsWrap.innerHTML = '';
    }
  }

  function navegarFotoModal(direcao) {
    indiceFotoAtual = (indiceFotoAtual + direcao + fotosModalAtual.length) % fotosModalAtual.length;
    renderizarFotoModal();
  }

  function irParaFotoModal(idx) {
    indiceFotoAtual = idx;
    renderizarFotoModal();
  }

  function abrirModal(id) {
    const imovel = imoveis.find(i => i.id === id);
    if (!imovel) return;

    fotosModalAtual = fotosDoImovel(imovel);
    indiceFotoAtual = 0;
    renderizarFotoModal();

    document.getElementById('modalPreco').textContent = imovel.preco;
    document.getElementById('modalTitulo').textContent = imovel.titulo;
    document.getElementById('modalLocal').textContent = `📍 ${imovel.bairro} · ${imovel.cidade}`;

    document.getElementById('modalSpecs').innerHTML = `
      ${imovel.quartos ? `<div class="modal-spec">🛏️ ${imovel.quartos} quarto${imovel.quartos > 1 ? 's' : ''}</div>` : ''}
      ${imovel.banheiros ? `<div class="modal-spec">🚿 ${imovel.banheiros} banheiro${imovel.banheiros > 1 ? 's' : ''}</div>` : ''}
      ${imovel.area ? `<div class="modal-spec">📐 ${imovel.area} m²</div>` : ''}
      ${imovel.vagas ? `<div class="modal-spec">🚗 ${imovel.vagas} vaga${imovel.vagas > 1 ? 's' : ''}</div>` : ''}
    `;

    document.getElementById('modalDesc').textContent = imovel.descricao;

    document.getElementById('modalAcoes').innerHTML = `
      <a href="https://wa.me/${imovel.whatsapp}?text=Olá! Tenho interesse no imóvel: ${encodeURIComponent(imovel.titulo)} - ${imovel.bairro}"
         target="_blank" class="btn-whatsapp-imovel" style="flex:1;">
        📱 Falar com o Corretor
      </a>
    `;

    document.getElementById('modalOverlay').classList.add('aberto');
    document.body.style.overflow = 'hidden';
  }

  function fecharModal(e) {
    if (e.target === document.getElementById('modalOverlay')) fecharModalBtn();
  }

  function fecharModalBtn() {
    document.getElementById('modalOverlay').classList.remove('aberto');
    document.body.style.overflow = '';
  }

  function renderizar() {
    const grid = document.getElementById('gridImoveis');
    const busca = document.getElementById('busca').value.toLowerCase();

    const filtrados = imoveis.filter(i => {
      const matchTipo = filtroAtivo === 'todos' || i.tipo === filtroAtivo;
      const matchBusca = !busca ||
        i.titulo.toLowerCase().includes(busca) ||
        i.bairro.toLowerCase().includes(busca) ||
        i.tipo.toLowerCase().includes(busca);
      return matchTipo && matchBusca;
    });

    const venda = imoveis.filter(i => i.tipo === 'Venda').length;
    const locacao = imoveis.filter(i => i.tipo === 'Locação').length;
    document.getElementById('statTotal').textContent = `${imoveis.length} imóvel${imoveis.length !== 1 ? 'is' : ''}`;
    document.getElementById('statVenda').textContent = `${venda} à venda`;
    document.getElementById('statLocacao').textContent = `${locacao} para alugar`;

    if (filtrados.length === 0) {
      grid.innerHTML = `
        <div class="vazio-wrap" style="grid-column:1/-1;">
          <div class="icone">🏠</div>
          <p>Nenhum imóvel encontrado.</p>
        </div>`;
      return;
    }

    grid.innerHTML = filtrados.map(i => {
      const fotos = fotosDoImovel(i);
      const capa = fotos[0];
      return `
      <div class="card-imovel">
        <div class="card-foto">
          ${capa ? `<img src="${capa}" alt="${i.titulo}">` : `<div class="sem-foto">🏠</div>`}
          <span class="badge-tipo-imovel ${formatarTipo(i.tipo)}">${i.tipo}</span>
          ${i.destaque ? `<span class="badge-destaque">⭐ Destaque</span>` : ''}
          ${fotos.length > 1 ? `<span class="badge-mais-fotos">📷 ${fotos.length}</span>` : ''}
        </div>
        <div class="card-body">
          <div class="card-preco">${i.preco}</div>
          <div class="card-titulo">${i.titulo}</div>
          <div class="card-local">📍 ${i.bairro} · ${i.cidade}</div>
          <div class="card-specs">
            ${i.quartos ? `<span class="spec">🛏️ ${i.quartos} qto${i.quartos > 1 ? 's' : ''}</span>` : ''}
            ${i.banheiros ? `<span class="spec">🚿 ${i.banheiros} bnh</span>` : ''}
            ${i.area ? `<span class="spec">📐 ${i.area}m²</span>` : ''}
            ${i.vagas ? `<span class="spec">🚗 ${i.vagas} vaga${i.vagas > 1 ? 's' : ''}</span>` : ''}
          </div>
          ${i.descricao ? `<div class="card-desc">${i.descricao}</div>` : ''}
          <div class="card-acoes">
            <a href="https://wa.me/${i.whatsapp}?text=Olá! Tenho interesse no imóvel: ${encodeURIComponent(i.titulo)}"
               target="_blank" class="btn-whatsapp-imovel">📱 WhatsApp</a>
            <button class="btn-ver-mais" onclick="abrirModal(${i.id})">🔍 Ver mais</button>
          </div>
        </div>
      </div>
    `;
    }).join('');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') fecharModalBtn();
  });

  renderizar();
</script>
</body>
</html>
