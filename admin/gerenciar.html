<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo | Imóveis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --azul: #1a56db;
  --azul-escuro: #1340a8;
  --azul-claro: #e8f0fe;
  --cinza: #f8faff;
  --cinza-borda: #e5e7eb;
  --texto: #555;
  --preto: #111;
  --branco: #fff;
  --sombra: 0 8px 32px rgba(26,86,219,.12);
  --radius: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--cinza); color: #222; }

header {
  background: linear-gradient(135deg, #0f172a 0%, #1a56db 100%);
  color: white;
  text-align: center;
  padding: 3rem 2rem 2.5rem;
  position: relative;
}

.header-nav {
  position: absolute;
  top: 1rem; left: 2rem; right: 2rem;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.btn-voltar-header {
  color: white; text-decoration: none;
  font-size: .85rem; font-weight: 600;
  opacity: .85; transition: opacity .2s;
}

.btn-voltar-header:hover { opacity: 1; }

header h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: .4rem; }
header p { opacity: .85; font-size: .9rem; }

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 4rem;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 1rem;
}

.toolbar h2 { font-size: 1.1rem; font-weight: 700; color: var(--preto); }

.btn-novo {
  background: var(--azul); color: white;
  border: none; padding: .7rem 1.3rem;
  border-radius: 9px; font-size: .9rem; font-weight: 700;
  cursor: pointer; font-family: inherit;
  transition: background .2s;
}

.btn-novo:hover { background: var(--azul-escuro); }

.grid-imoveis {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.5rem;
}

.card-imovel {
  background: white;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,.07);
  border: 1px solid var(--cinza-borda);
}

.card-foto {
  position: relative; height: 200px;
  overflow: hidden; background: #e5e7eb;
}

.card-foto img { width: 100%; height: 100%; object-fit: cover; }

.card-foto .sem-foto {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 3rem; color: #ccc; background: #f3f4f6;
}

.badge-tipo-imovel {
  position: absolute; top: 12px; left: 12px;
  background: var(--azul); color: white;
  font-size: .7rem; font-weight: 700;
  padding: .25rem .7rem; border-radius: 999px;
  text-transform: uppercase; letter-spacing: .3px;
}

.badge-tipo-imovel.venda { background: #0f172a; }
.badge-tipo-imovel.locacao { background: #059669; }
.badge-tipo-imovel.temporada { background: #7c3aed; }

.card-body { padding: 1.1rem; }
.card-preco { font-size: 1.3rem; font-weight: 800; color: var(--azul); margin-bottom: .2rem; }
.card-titulo { font-size: .92rem; font-weight: 700; color: var(--preto); margin-bottom: .4rem; }

.card-local {
  font-size: .8rem; color: var(--texto);
  margin-bottom: .9rem;
}

.card-acoes { display: flex; gap: .5rem; }

.btn-editar, .btn-excluir {
  flex: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
  border: none; padding: .6rem;
  border-radius: 9px; font-size: .82rem; font-weight: 700;
  cursor: pointer; font-family: inherit;
  transition: background .2s;
}

.btn-editar { background: var(--azul-claro); color: var(--azul); }
.btn-editar:hover { background: #c7d7fc; }

.btn-excluir { background: #fde8e8; color: #c0392b; }
.btn-excluir:hover { background: #fbd0d0; }

.vazio-wrap {
  text-align: center; padding: 4rem 2rem; color: #aaa;
  grid-column: 1/-1;
}

.vazio-wrap .icone { font-size: 3rem; margin-bottom: 1rem; }

/* MODAL FORMULÁRIO */
.modal-overlay {
  display: none; position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.6);
  z-index: 1000; padding: 1rem;
  overflow-y: auto;
}

.modal-overlay.aberto { display: flex; align-items: flex-start; justify-content: center; padding-top: 2rem; }

.modal {
  background: white; border-radius: var(--radius);
  max-width: 600px; width: 100%; overflow: hidden;
}

.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--cinza-borda);
}

.modal-header h3 { font-size: 1.05rem; font-weight: 700; }

.btn-fechar {
  background: none; border: none;
  font-size: 1.3rem; cursor: pointer; color: #888;
}

.modal-body { padding: 1.5rem; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.form-grid .full { grid-column: 1/-1; }

.campo label {
  display: block;
  font-size: .78rem; font-weight: 700;
  color: var(--texto); margin-bottom: .35rem;
}

.campo input, .campo select, .campo textarea {
  width: 100%;
  padding: .6rem .75rem;
  border: 1.5px solid var(--cinza-borda);
  border-radius: 8px;
  font-size: .87rem; font-family: inherit;
  outline: none;
}

.campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--azul); }

.campo textarea { resize: vertical; min-height: 70px; }

.campo-checkbox {
  display: flex; align-items: center; gap: .5rem;
  margin-top: .3rem;
}

.campo-checkbox input { width: auto; }

.modal-footer {
  padding: 1.25rem 1.5rem;
  border-top: 1px solid var(--cinza-borda);
  display: flex; justify-content: flex-end; gap: .75rem;
}

.btn-cancelar {
  background: #f1f2f4; color: #555;
  border: none; padding: .7rem 1.3rem;
  border-radius: 9px; font-size: .87rem; font-weight: 700;
  cursor: pointer; font-family: inherit;
}

.btn-salvar {
  background: var(--azul); color: white;
  border: none; padding: .7rem 1.3rem;
  border-radius: 9px; font-size: .87rem; font-weight: 700;
  cursor: pointer; font-family: inherit;
}

.btn-salvar:hover { background: var(--azul-escuro); }

.thumbs-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  margin-top: .6rem;
}

.thumb-item {
  position: relative;
  width: 72px;
  height: 72px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--cinza-borda);
}

.thumb-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

.thumb-remover {
  position: absolute;
  top: 2px; right: 2px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(0,0,0,.65);
  color: white;
  border: none;
  font-size: .7rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.thumb-remover:hover { background: #c0392b; }

.badge-mais-fotos {
  position: absolute; bottom: 8px; right: 8px;
  background: rgba(0,0,0,.65); color: white;
  font-size: .68rem; font-weight: 700;
  padding: .15rem .5rem; border-radius: 999px;
}

@media (max-width: 600px) {
  .form-grid { grid-template-columns: 1fr; }
  .grid-imoveis { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="header-nav">
    <a href="../index.html" class="btn-voltar-header">← Voltar ao site</a>
  </div>
  <h1>⚙️ Painel Administrativo</h1>
  <p>Gerencie os imóveis cadastrados no site</p>
</header>

<div class="container">

  <div class="toolbar">
    <h2 id="contador">0 imóveis cadastrados</h2>
    <button class="btn-novo" onclick="abrirFormulario()">+ Novo Imóvel</button>
  </div>

  <div id="gridImoveis" class="grid-imoveis"></div>

</div>

<!-- MODAL FORMULÁRIO -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharSeClicouFora(event)">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitulo">Novo Imóvel</h3>
      <button class="btn-fechar" onclick="fecharFormulario()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="campo full">
          <label>Título</label>
          <input type="text" id="fTitulo" placeholder="Ex: Flat beira mar">
        </div>
        <div class="campo">
          <label>Preço</label>
          <input type="text" id="fPreco" placeholder="R$ 0,00" oninput="mascararPreco(this)" inputmode="numeric">
        </div>
        <div class="campo">
          <label>Tipo</label>
          <select id="fTipo">
            <option value="Venda">Venda</option>
            <option value="Locação">Locação</option>
            <option value="Temporada">Temporada</option>
          </select>
        </div>
        <div class="campo">
          <label>Bairro</label>
          <input type="text" id="fBairro" placeholder="Ex: Bessa">
        </div>
        <div class="campo">
          <label>Cidade</label>
          <input type="text" id="fCidade" placeholder="Ex: João Pessoa/PB">
        </div>
        <div class="campo">
          <label>Quartos</label>
          <input type="number" id="fQuartos" min="0">
        </div>
        <div class="campo">
          <label>Banheiros</label>
          <input type="number" id="fBanheiros" min="0">
        </div>
        <div class="campo">
          <label>Área (m²)</label>
          <input type="number" id="fArea" min="0">
        </div>
        <div class="campo">
          <label>Vagas</label>
          <input type="number" id="fVagas" min="0">
        </div>
        <div class="campo full">
          <label>WhatsApp (só números, com DDI+DDD, ex: 5583999999999)</label>
          <input type="text" id="fWhatsapp" placeholder="5583999999999">
        </div>
        <div class="campo full">
          <label>Fotos do Imóvel (pode escolher várias, ou adicionar aos poucos)</label>
          <input type="file" id="fFotosArquivos" accept="image/*" multiple>
          <div id="fFotosPreview" class="thumbs-wrap"></div>
        </div>
        <div class="campo full">
          <label>Descrição</label>
          <textarea id="fDescricao"></textarea>
        </div>
        <div class="campo full">
          <div class="campo-checkbox">
            <input type="checkbox" id="fDestaque">
            <label style="margin:0;">Marcar como destaque</label>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharFormulario()">Cancelar</button>
      <button class="btn-salvar" onclick="salvarImovel()">Salvar</button>
    </div>
  </div>
</div>

<script>
  const CHAVE_IMOVEIS = 'imoveisCF';
  let imoveis = JSON.parse(localStorage.getItem(CHAVE_IMOVEIS)) || [];
  let idEmEdicao = null;

  function salvar() {
    localStorage.setItem(CHAVE_IMOVEIS, JSON.stringify(imoveis));
  }

  function formatarTipo(tipo) {
    const map = { 'Venda': 'venda', 'Locação': 'locacao', 'Temporada': 'temporada' };
    return map[tipo] || '';
  }

  function mascararPreco(campo) {
    let digitos = campo.value.replace(/\D/g, '');
    if (!digitos) { campo.value = ''; return; }
    digitos = digitos.replace(/^0+(?=\d)/, '');
    while (digitos.length < 3) digitos = '0' + digitos;
    const centavos = digitos.slice(-2);
    let inteiro = digitos.slice(0, -2);
    inteiro = inteiro.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    campo.value = `R$ ${inteiro},${centavos}`;
  }

  function renderizar() {
    const grid = document.getElementById('gridImoveis');
    document.getElementById('contador').textContent =
      `${imoveis.length} imóvel${imoveis.length !== 1 ? 'is' : ''} cadastrado${imoveis.length !== 1 ? 's' : ''}`;

    if (imoveis.length === 0) {
      grid.innerHTML = `
        <div class="vazio-wrap">
          <div class="icone">🏠</div>
          <p>Nenhum imóvel cadastrado ainda. Clique em "+ Novo Imóvel" para começar.</p>
        </div>`;
      return;
    }

    grid.innerHTML = imoveis.map(i => {
      const listaFotos = (i.fotos && i.fotos.length) ? i.fotos : (i.foto ? [i.foto] : []);
      const capa = listaFotos[0];
      return `
      <div class="card-imovel">
        <div class="card-foto">
          ${capa ? `<img src="${capa}" alt="${i.titulo}">` : `<div class="sem-foto">🏠</div>`}
          <span class="badge-tipo-imovel ${formatarTipo(i.tipo)}">${i.tipo}</span>
          ${listaFotos.length > 1 ? `<span class="badge-mais-fotos">📷 ${listaFotos.length}</span>` : ''}
        </div>
        <div class="card-body">
          <div class="card-preco">${i.preco}</div>
          <div class="card-titulo">${i.titulo}</div>
          <div class="card-local">📍 ${i.bairro} · ${i.cidade}</div>
          <div class="card-acoes">
            <button class="btn-editar" onclick="editarImovel(${i.id})">✏️ Editar</button>
            <button class="btn-excluir" onclick="excluirImovel(${i.id})">🗑️ Excluir</button>
          </div>
        </div>
      </div>
    `;
    }).join('');
  }

  function abrirFormulario() {
    idEmEdicao = null;
    document.getElementById('modalTitulo').textContent = 'Novo Imóvel';
    limparFormulario();
    document.getElementById('modalOverlay').classList.add('aberto');
    document.body.style.overflow = 'hidden';
  }

  function editarImovel(id) {
    const imovel = imoveis.find(i => i.id === id);
    if (!imovel) return;
    idEmEdicao = id;
    document.getElementById('modalTitulo').textContent = 'Editar Imóvel';
    document.getElementById('fTitulo').value = imovel.titulo || '';
    document.getElementById('fPreco').value = imovel.preco || '';
    document.getElementById('fTipo').value = imovel.tipo || 'Venda';
    document.getElementById('fBairro').value = imovel.bairro || '';
    document.getElementById('fCidade').value = imovel.cidade || '';
    document.getElementById('fQuartos').value = imovel.quartos || '';
    document.getElementById('fBanheiros').value = imovel.banheiros || '';
    document.getElementById('fArea').value = imovel.area || '';
    document.getElementById('fVagas').value = imovel.vagas || '';
    document.getElementById('fWhatsapp').value = imovel.whatsapp || '';
    fotosSelecionadas = (imovel.fotos && imovel.fotos.length) ? [...imovel.fotos] : (imovel.foto ? [imovel.foto] : []);
    renderizarThumbs();
    document.getElementById('fDescricao').value = imovel.descricao || '';
    document.getElementById('fDestaque').checked = !!imovel.destaque;
    document.getElementById('modalOverlay').classList.add('aberto');
    document.body.style.overflow = 'hidden';
  }

  function limparFormulario() {
    ['fTitulo','fPreco','fBairro','fCidade','fQuartos','fBanheiros','fArea','fVagas','fWhatsapp','fDescricao']
      .forEach(id => document.getElementById(id).value = '');
    fotosSelecionadas = [];
    renderizarThumbs();
    document.getElementById('fTipo').value = 'Venda';
    document.getElementById('fDestaque').checked = false;
  }

  function fecharFormulario() {
    document.getElementById('modalOverlay').classList.remove('aberto');
    document.body.style.overflow = '';
  }

  function fecharSeClicouFora(e) {
    if (e.target === document.getElementById('modalOverlay')) fecharFormulario();
  }

  let fotosSelecionadas = [];

  function toBase64(arquivo) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(arquivo);
    });
  }

  function renderizarThumbs() {
    const wrap = document.getElementById('fFotosPreview');
    wrap.innerHTML = fotosSelecionadas.map((f, idx) => `
      <div class="thumb-item">
        <img src="${f}">
        <button type="button" class="thumb-remover" onclick="removerFoto(${idx})">✕</button>
      </div>
    `).join('');
  }

  function removerFoto(idx) {
    fotosSelecionadas.splice(idx, 1);
    renderizarThumbs();
  }

  document.getElementById('fFotosArquivos').addEventListener('change', async (e) => {
    const arquivos = Array.from(e.target.files);
    for (const arquivo of arquivos) {
      const base64 = await toBase64(arquivo);
      fotosSelecionadas.push(base64);
    }
    e.target.value = '';
    renderizarThumbs();
  });

  async function salvarImovel() {
    const titulo = document.getElementById('fTitulo').value.trim();
    const preco = document.getElementById('fPreco').value.trim();

    if (!titulo || !preco) {
      alert('Preencha ao menos o título e o preço.');
      return;
    }

    const dados = {
      titulo,
      preco,
      tipo: document.getElementById('fTipo').value,
      bairro: document.getElementById('fBairro').value.trim(),
      cidade: document.getElementById('fCidade').value.trim(),
      quartos: Number(document.getElementById('fQuartos').value) || 0,
      banheiros: Number(document.getElementById('fBanheiros').value) || 0,
      area: Number(document.getElementById('fArea').value) || 0,
      vagas: Number(document.getElementById('fVagas').value) || 0,
      whatsapp: document.getElementById('fWhatsapp').value.trim(),
      fotos: [...fotosSelecionadas],
      descricao: document.getElementById('fDescricao').value.trim(),
      destaque: document.getElementById('fDestaque').checked
    };

    if (idEmEdicao !== null) {
      const idx = imoveis.findIndex(i => i.id === idEmEdicao);
      if (idx !== -1) imoveis[idx] = { ...imoveis[idx], ...dados };
    } else {
      const novoId = imoveis.length > 0 ? Math.max(...imoveis.map(i => i.id)) + 1 : 1;
      imoveis.push({ id: novoId, ...dados });
    }

    salvar();
    renderizar();
    fecharFormulario();
  }

  function excluirImovel(id) {
    if (!confirm('Tem certeza que deseja excluir este imóvel?')) return;
    imoveis = imoveis.filter(i => i.id !== id);
    salvar();
    renderizar();
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') fecharFormulario();
  });

  renderizar();
</script>
</body>
</html>
