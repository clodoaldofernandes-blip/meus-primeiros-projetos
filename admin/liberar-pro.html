<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liberar ou retirar PRO | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --azul: #1a56db;
  --azul-escuro: #1340a8;
  --cinza: #f8faff;
  --cinza-borda: #e5e7eb;
  --verde: #059669;
  --vermelho: #c0392b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--cinza);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.card {
  background: white;
  border-radius: 16px;
  padding: 2rem 1.75rem;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 8px 32px rgba(26,86,219,.12);
}
h1 { font-size: 1.3rem; font-weight: 800; margin-bottom: .3rem; text-align: center; }
p.sub { font-size: .85rem; color: #777; text-align: center; margin-bottom: 1.75rem; }
.campo { margin-bottom: 1.1rem; }
.campo label {
  display: block; font-size: .8rem; font-weight: 700;
  color: #555; margin-bottom: .4rem;
}
.campo input, .campo select {
  width: 100%; padding: .8rem .9rem;
  border: 1.5px solid var(--cinza-borda); border-radius: 10px;
  font-size: 1rem; font-family: inherit; outline: none;
  background: white;
}
.campo input:focus, .campo select:focus { border-color: var(--azul); }
button {
  width: 100%; background: var(--azul); color: white;
  border: none; padding: .9rem; border-radius: 10px;
  font-size: 1rem; font-weight: 700; font-family: inherit;
  cursor: pointer; margin-top: .5rem;
}
button:hover { background: var(--azul-escuro); }
button.btn-retirar { background: white; color: var(--vermelho); border: 2px solid var(--vermelho); margin-top: .75rem; }
button.btn-retirar:hover { background: #fde8e8; }
button:disabled { opacity: .6; cursor: not-allowed; }
.mensagem {
  margin-top: 1.2rem; padding: .8rem 1rem;
  border-radius: 10px; font-size: .85rem; font-weight: 600;
  text-align: center; display: none;
}
.mensagem.sucesso { display: block; background: #e6f7ef; color: var(--verde); }
.mensagem.erro { display: block; background: #fde8e8; color: var(--vermelho); }
</style>
</head>
<body>

<div class="card">
  <h1>🔓 Liberar PRO</h1>
  <p class="sub">Libere ou retire o acesso PRO de um cliente manualmente</p>

  <div class="campo">
    <label>Senha de administrador</label>
    <input type="password" id="fSenha" placeholder="Sua senha">
  </div>

  <div class="campo">
    <label>Produto</label>
    <select id="fProduto">
      <option value="">Selecione o produto...</option>
      <option value="estetica">Estética Fácil</option>
      <option value="cliente">Cliente Fácil</option>
      <option value="fisio">Fisioterapia Fácil</option>
      <option value="loja">Loja Fácil</option>
    </select>
  </div>

  <div class="campo">
    <label>E-mail do cliente</label>
    <input type="email" id="fEmail" placeholder="cliente@email.com" autocapitalize="off" autocorrect="off">
  </div>

  <button id="btnLiberar" onclick="alterarPro('liberar')">Liberar PRO</button>
  <button id="btnRetirar" class="btn-retirar" onclick="alterarPro('retirar')">Retirar PRO</button>

  <div id="mensagem" class="mensagem"></div>
</div>

<script>
async function alterarPro(acao) {
  const senha = document.getElementById('fSenha').value;
  const email = document.getElementById('fEmail').value.trim();
  const select = document.getElementById('fProduto');
  const produto = select.value;
  const nomeProduto = select.options[select.selectedIndex].text;
  const btnLiberar = document.getElementById('btnLiberar');
  const btnRetirar = document.getElementById('btnRetirar');
  const msg = document.getElementById('mensagem');
  const retirar = acao === 'retirar';

  msg.className = 'mensagem';
  msg.textContent = '';

  if (!senha || !email) {
    msg.className = 'mensagem erro';
    msg.textContent = 'Preencha a senha e o e-mail.';
    return;
  }

  if (!produto) {
    msg.className = 'mensagem erro';
    msg.textContent = 'Selecione o produto.';
    return;
  }

  if (retirar && !confirm('Retirar o PRO do ' + nomeProduto + ' de ' + email + '?\n\nO cliente volta para o plano gratuito.')) {
    return;
  }

  btnLiberar.disabled = true;
  btnRetirar.disabled = true;
  const botao = retirar ? btnRetirar : btnLiberar;
  botao.textContent = retirar ? 'Retirando...' : 'Liberando...';

  try {
    const resposta = await fetch('/api/liberar-pro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha, produto, acao })
    });
    const dados = await resposta.json();

    if (resposta.ok) {
      msg.className = 'mensagem sucesso';
      msg.textContent = retirar
        ? '✅ PRO do ' + (dados.produto || 'produto') + ' retirado de ' + dados.email
        : '✅ PRO do ' + (dados.produto || 'produto') + ' liberado para ' + dados.email;
      document.getElementById('fEmail').value = '';
    } else {
      msg.className = 'mensagem erro';
      msg.textContent = '❌ ' + (dados.error || 'Erro ao alterar o PRO');
    }
  } catch (erro) {
    msg.className = 'mensagem erro';
    msg.textContent = '❌ Erro de conexão. Tente novamente.';
  }

  btnLiberar.disabled = false;
  btnRetirar.disabled = false;
  btnLiberar.textContent = 'Liberar PRO';
  btnRetirar.textContent = 'Retirar PRO';
}
</script>
</body>
</html>
