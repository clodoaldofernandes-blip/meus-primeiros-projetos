    <p style="color:#555; font-size:.9rem; line-height:1.6; margin-bottom:1.5rem;">Você usou seus <strong>2 cálculos gratuitos</strong> do ITBI.<br>Para calcular sem limites, adquira o plano PRO.</p>

<div class="card">

<h1>🏠 Calculadora de ITBI</h1>

<label>Valor do imóvel (R$)</label>
<input type="text" id="valor" placeholder="250.000,00" inputmode="numeric" oninput="mascararMoeda(this)">

<label>Alíquota (%)</label>
<input type="number" id="aliquota" value="3">

<button onclick="calcularITBI()">
Calcular ITBI
</button>

<div id="resultado"></div>

<a href="ferramentas.html" class="voltar">
← Voltar para Ferramentas
</a>

</div>

<script>

function mascararMoeda(campo) {
  let digitos = campo.value.replace(/\D/g, '');
  if (!digitos) { campo.value = ''; return; }
  digitos = digitos.replace(/^0+(?=\d)/, '');
  while (digitos.length < 3) digitos = '0' + digitos;
  const centavos = digitos.slice(-2);
  let inteiro = digitos.slice(0, -2);
  inteiro = inteiro.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  campo.value = `${inteiro},${centavos}`;
}

function parseBR(str) {
  if (!str) return 0;
  const limpo = str.toString().replace(/\./g, '').replace(',', '.');
  return parseFloat(limpo) || 0;
}

function calcularITBI() {

    if (!verificarLimite()) return;
    registrarUso();

    const valor = parseBR(document.getElementById("valor").value);

    const aliquota =
        parseFloat(document.getElementById("aliquota").value);

    if(isNaN(valor) || valor <= 0){
        alert("Informe o valor do imóvel.");
        return;
    }

    const itbi =
        (valor * aliquota) / 100;

    const resultado =
        document.getElementById("resultado");

    resultado.style.display = "block";

    resultado.innerHTML =
        "ITBI estimado: R$ " +
        itbi.toLocaleString(
            "pt-BR",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );
}

const CHAVE_USO_CALC = 'usosCF_itbi';
  const LIMITE_USO = 2;

  function verificarLimite() {
    const usos = Number(localStorage.getItem(CHAVE_USO_CALC) || 0);
    if (usos >= LIMITE_USO) {
      document.getElementById('bloqueioOverlay').style.display = 'flex';
      return false;
    }
    return true;
  }

  function registrarUso() {
    const usos = Number(localStorage.getItem(CHAVE_USO_CALC) || 0);
    localStorage.setItem(CHAVE_USO_CALC, usos + 1);
  }

  window.addEventListener('load', () => {
    const usos = Number(localStorage.getItem(CHAVE_USO_CALC) || 0);
    if (usos >= LIMITE_USO) {
      document.getElementById('bloqueioOverlay').style.display = 'flex';
    }
  });

</script>

</body>
