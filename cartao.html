<style>

    --azul-escuro: #1340a8;
    --cinza-borda: #e5e7eb;

    --preto: #111;

  body {

    display: flex;

    text-align: center;
  }

  .foto {
    width: 96px;

    border: 3px solid rgba(255,255,255,.85);
    box-shadow: 0 0 0 6px rgba(255,255,255,.15);

  .corpo {

  .nome {

    color: var(--preto);

    font-weight: 700;

    margin-top: .2rem;

  }

  .tags {
    display: flex;
    gap: .4rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 1rem;
  }

  .tag {
    background: #e8f0fe;
    color: var(--azul);
    font-size: .72rem;
    font-weight: 700;
    padding: .3rem .8rem;
    border-radius: 999px;
  }

  .acoes {
    display: flex;
    flex-direction: column;
    gap: .65rem;
    margin-top: 1.75rem;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .55rem;
    padding: .85rem 1rem;
    border-radius: 11px;
    font-size: .92rem;
    font-weight: 700;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s, opacity .15s;
  }

  .btn:hover { transform: translateY(-1px); }

  .btn-salvar {
    background: var(--azul);
    color: white;
    box-shadow: 0 4px 14px rgba(26,86,219,.3);

  .btn-salvar:hover { background: var(--azul-escuro); }

  .btn-whats {

  .btn-email {

  .btn-linkedin {

  .btn-github {

<script>
  function salvarContato() {
    const vcard = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:Fernandes;Clodoaldo;;;',
      'FN:Clodoaldo Fernandes',
      'TITLE:Analista e Desenvolvedor de Sistemas',
      'TEL;TYPE=CELL:+5583982001314',
      'EMAIL:clodoaldo.fernandes@gmail.com',
      'URL:https://clodoaldofernandes.com.br',
      'ADR;TYPE=WORK:;;;João Pessoa;PB;;Brasil',
      'END:VCARD'
    ].join('\n');

    const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'clodoaldo-fernandes.vcf';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
